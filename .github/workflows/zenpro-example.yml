name: ZenPro Example Workflow
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  call-zenpro:
    uses: ./.github/workflows/zenpro-reusable.yml

  run-using-zenpro:
    runs-on: ubuntu-latest
    needs: call-zenpro
    env:
      ZENPRO: ${{ needs.call-zenpro.outputs.zenpro }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Demonstrate using ZENPRO
        run: |
          if [ -z "$ZENPRO" ]; then
            echo "ZENPRO not available"
            exit 1
          fi
          echo "ZENPRO is present (masked by GitHub)."
        shell: bash
