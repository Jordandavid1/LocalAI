<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalAI - Uncensored LLM Toolkit</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1e1e2e 0%, #2d2d44 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #00d4ff, #0099ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .subtitle {
            color: #888;
            font-size: 1.1em;
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            flex-wrap: wrap;
        }
        
        .tab-btn {
            padding: 12px 24px;
            background: transparent;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 1em;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }
        
        .tab-btn.active {
            color: #00d4ff;
            border-bottom-color: #00d4ff;
        }
        
        .tab-btn:hover {
            color: #00d4ff;
        }
        
        .tab-content {
            display: none;
            animation: fadeIn 0.3s;
        }
        
        .tab-content.active {
            display: block;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .panel {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #00d4ff;
        }
        
        input, textarea, select {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #e0e0e0;
            font-family: inherit;
            font-size: 1em;
            transition: all 0.3s;
        }
        
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #00d4ff;
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.2);
        }
        
        textarea {
            resize: vertical;
            min-height: 120px;
            font-family: 'Monaco', 'Courier New', monospace;
        }
        
        button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #00d4ff, #0099ff);
            border: none;
            border-radius: 8px;
            color: #1e1e2e;
            font-weight: 600;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 212, 255, 0.3);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .output {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
            max-height: 500px;
            overflow-y: auto;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 0.95em;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }
        
        .chat-container {
            display: flex;
            flex-direction: column;
            height: 600px;
        }
        
        .messages {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 20px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
        }
        
        .message {
            margin-bottom: 15px;
            padding: 12px 16px;
            border-radius: 8px;
            animation: slideIn 0.3s;
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message.user {
            background: rgba(0, 212, 255, 0.15);
            border-left: 3px solid #00d4ff;
            margin-left: 40px;
        }
        
        .message.assistant {
            background: rgba(100, 200, 255, 0.1);
            border-left: 3px solid #6666ff;
            margin-right: 40px;
        }
        
        .message-role {
            font-weight: 600;
            color: #00d4ff;
            font-size: 0.9em;
            margin-bottom: 5px;
        }
        
        .message.assistant .message-role {
            color: #6666ff;
        }
        
        .image-preview {
            max-width: 100%;
            max-height: 400px;
            border-radius: 8px;
            margin-top: 10px;
        }
        
        .slider-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .slider-item {
            display: flex;
            flex-direction: column;
        }
        
        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.2);
            outline: none;
            -webkit-appearance: none;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #00d4ff;
            cursor: pointer;
        }
        
        input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #00d4ff;
            cursor: pointer;
            border: none;
        }
        
        .value-display {
            color: #00d4ff;
            font-weight: 600;
            margin-top: 5px;
        }
        
        .status {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .status.success {
            background: rgba(0, 200, 100, 0.2);
            border: 1px solid rgba(0, 200, 100, 0.5);
            color: #00c864;
        }
        
        .status.error {
            background: rgba(255, 100, 100, 0.2);
            border: 1px solid rgba(255, 100, 100, 0.5);
            color: #ff6464;
        }
        
        .status.loading {
            background: rgba(0, 212, 255, 0.2);
            border: 1px solid rgba(0, 212, 255, 0.5);
            color: #00d4ff;
        }
        
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(0, 212, 255, 0.3);
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        @media (max-width: 768px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }
            
            .slider-group {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>LocalAI</h1>
            <p class="subtitle">Uncensored LLM Toolkit - Mixtral + Image Gen + Vision + Embeddings</p>
            <div id="status" style="margin-top: 15px; font-size: 0.9em;"></div>
        </header>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('chat')">Chat</button>
            <button class="tab-btn" onclick="switchTab('image')">Image Generation</button>
            <button class="tab-btn" onclick="switchTab('embeddings')">Embeddings</button>
            <button class="tab-btn" onclick="switchTab('code')">Code Execution</button>
            <button class="tab-btn" onclick="switchTab('models')">Models</button>
        </div>
        
        <!-- Chat Tab -->
        <div id="chat" class="tab-content active">
            <div class="panel">
                <div class="chat-container">
                    <div class="messages" id="messages"></div>
                    <div class="form-group">
                        <textarea id="chatInput" placeholder="Type your message here..."></textarea>
                    </div>
                    <div class="slider-group">
                        <div class="slider-item">
                            <label>Temperature: <span id="tempValue">0.7</span></label>
                            <input type="range" id="temperature" min="0" max="2" step="0.1" value="0.7" onchange="updateValue('temperature', 'tempValue')">
                        </div>
                        <div class="slider-item">
                            <label>Max Tokens: <span id="tokensValue">2048</span></label>
                            <input type="range" id="maxTokens" min="256" max="4096" step="256" value="2048" onchange="updateValue('maxTokens', 'tokensValue')">
                        </div>
                    </div>
                    <button onclick="sendChat()" style="margin-top: 15px; width: 100%;">Send Message</button>
                </div>
            </div>
        </div>
        
        <!-- Image Generation Tab -->
        <div id="image" class="tab-content">
            <div class="panel">
                <div class="form-group">
                    <label>Prompt</label>
                    <textarea id="imagePrompt" placeholder="Describe the image you want to generate..."></textarea>
                </div>
                <div class="form-group">
                    <label>Negative Prompt (optional)</label>
                    <textarea id="negativePrompt" placeholder="What to avoid in the image..."></textarea>
                </div>
                <div class="grid-2">
                    <div class="form-group">
                        <label>Width: <span id="widthValue">512</span></label>
                        <input type="range" id="width" min="256" max="768" step="64" value="512" onchange="updateValue('width', 'widthValue')">
                    </div>
                    <div class="form-group">
                        <label>Height: <span id="heightValue">512</span></label>
                        <input type="range" id="height" min="256" max="768" step="64" value="512" onchange="updateValue('height', 'heightValue')">
                    </div>
                    <div class="form-group">
                        <label>Steps: <span id="stepsValue">30</span></label>
                        <input type="range" id="steps" min="10" max="50" step="1" value="30" onchange="updateValue('steps', 'stepsValue')">
                    </div>
                    <div class="form-group">
                        <label>Guidance Scale: <span id="guidanceValue">7.5</span></label>
                        <input type="range" id="guidance" min="1" max="20" step="0.5" value="7.5" onchange="updateValue('guidance', 'guidanceValue')">
                    </div>
                </div>
                <button onclick="generateImage()" style="width: 100%; margin-top: 20px;">Generate Image</button>
                <div id="imageOutput"></div>
            </div>
        </div>
        
        <!-- Embeddings Tab -->
        <div id="embeddings" class="tab-content">
            <div class="panel">
                <div class="form-group">
                    <label>Text to Embed</label>
                    <textarea id="embeddingText" placeholder="Enter text to generate embeddings..."></textarea>
                </div>
                <button onclick="getEmbedding()" style="width: 100%;">Generate Embedding</button>
                <div id="embeddingOutput"></div>
            </div>
        </div>
        
        <!-- Code Execution Tab -->
        <div id="code" class="tab-content">
            <div class="panel">
                <div class="form-group">
                    <label>Python Code</label>
                    <textarea id="codeInput" placeholder="Enter Python code to execute...">print('Hello from LocalAI!')</textarea>
                </div>
                <button onclick="executeCode()" style="width: 100%;">Execute Code</button>
                <div id="codeOutput"></div>
            </div>
        </div>
        
        <!-- Models Tab -->
        <div id="models" class="tab-content">
            <div class="panel">
                <h2 style="margin-bottom: 20px;">Available Models</h2>
                <button onclick="listModels()" style="width: 100%; margin-bottom: 20px;">Refresh Models</button>
                <div id="modelsList"></div>
                
                <h3 style="margin-top: 30px; margin-bottom: 15px;">Pull New Model</h3>
                <div class="form-group">
                    <label>Model Name (e.g., dolphin-mixtral, neural-chat, hermes)</label>
                    <input type="text" id="modelName" placeholder="Enter model name...">
                </div>
                <button onclick="pullModel()" style="width: 100%;">Pull Model</button>
                <div id="pullOutput"></div>
            </div>
        </div>
    </div>
    
    <script>
        const API_URL = 'http://localhost:8000';
        
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }
        
        function updateValue(inputId, displayId) {
            document.getElementById(displayId).textContent = document.getElementById(inputId).value;
        }
        
        function showStatus(message, type = 'loading') {
            const status = document.getElementById('status');
            status.innerHTML = `<span class="spinner"></span> ${message}`;
            status.className = `status ${type}`;
        }
        
        async function checkHealth() {
            try {
                const response = await fetch(`${API_URL}/health`);
                const data = await response.json();
                showStatus(`Connected - Device: ${data.device}`, 'success');
            } catch (e) {
                showStatus('Disconnected - Backend not running', 'error');
            }
        }
        
        async function sendChat() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            if (!message) return;
            
            const messages = document.getElementById('messages');
            messages.innerHTML += `<div class="message user"><div class="message-role">You</div>${escapeHtml(message)}</div>`;
            input.value = '';
            
            showStatus('Mixtral is thinking...', 'loading');
            
            try {
                const response = await fetch(`${API_URL}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        messages: [{ role: 'user', content: message }],
                        temperature: parseFloat(document.getElementById('temperature').value),
                        max_tokens: parseInt(document.getElementById('maxTokens').value)
                    })
                });
                
                const data = await response.json();
                messages.innerHTML += `<div class="message assistant"><div class="message-role">Mixtral</div>${escapeHtml(data.response)}</div>`;
                messages.scrollTop = messages.scrollHeight;
                showStatus('Ready', 'success');
            } catch (e) {
                messages.innerHTML += `<div class="message assistant"><div class="message-role">Error</div>${escapeHtml(e.message)}</div>`;
                showStatus('Error', 'error');
            }
        }
        
        async function generateImage() {
            const prompt = document.getElementById('imagePrompt').value.trim();
            if (!prompt) return alert('Enter a prompt');
            
            showStatus('Generating image...', 'loading');
            
            try {
                const response = await fetch(`${API_URL}/generate-image`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        prompt,
                        negative_prompt: document.getElementById('negativePrompt').value,
                        width: parseInt(document.getElementById('width').value),
                        height: parseInt(document.getElementById('height').value),
                        num_inference_steps: parseInt(document.getElementById('steps').value),
                        guidance_scale: parseFloat(document.getElementById('guidance').value)
                    })
                });
                
                const data = await response.json();
                document.getElementById('imageOutput').innerHTML = `<img src="data:image/png;base64,${data.image}" class="image-preview">`;
                showStatus('Image generated', 'success');
            } catch (e) {
                document.getElementById('imageOutput').innerHTML = `<div class="status error">${e.message}</div>`;
                showStatus('Error', 'error');
            }
        }
        
        async function getEmbedding() {
            const text = document.getElementById('embeddingText').value.trim();
            if (!text) return alert('Enter text');
            
            showStatus('Generating embedding...', 'loading');
            
            try {
                const response = await fetch(`${API_URL}/embeddings`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });
                
                const data = await response.json();
                const embedding = data.embedding.slice(0, 10).map(v => v.toFixed(4)).join(', ');
                document.getElementById('embeddingOutput').innerHTML = `<div class="output">Embedding (first 10 dims): [${embedding}, ...]</div>`;
                showStatus('Embedding generated', 'success');
            } catch (e) {
                document.getElementById('embeddingOutput').innerHTML = `<div class="status error">${e.message}</div>`;
                showStatus('Error', 'error');
            }
        }
        
        async function executeCode() {
            const code = document.getElementById('codeInput').value.trim();
            if (!code) return alert('Enter code');
            
            showStatus('Executing code...', 'loading');
            
            try {
                const response = await fetch(`${API_URL}/execute-code`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code, language: 'python' })
                });
                
                const data = await response.json();
                document.getElementById('codeOutput').innerHTML = `<div class="output">${escapeHtml(data.output)}</div>`;
                showStatus('Code executed', 'success');
            } catch (e) {
                document.getElementById('codeOutput').innerHTML = `<div class="status error">${e.message}</div>`;
                showStatus('Error', 'error');
            }
        }
        
        async function listModels() {
            showStatus('Loading models...', 'loading');
            
            try {
                const response = await fetch(`${API_URL}/models/list`);
                const data = await response.json();
                const html = data.models.length ? data.models.map(m => `<div style="padding: 10px; background: rgba(255,255,255,0.05); margin: 5px 0; border-radius: 4px;">${m}</div>`).join('') : 'No models found';
                document.getElementById('modelsList').innerHTML = html;
                showStatus('Models loaded', 'success');
            } catch (e) {
                document.getElementById('modelsList').innerHTML = `<div class="status error">${e.message}</div>`;
                showStatus('Error', 'error');
            }
        }
        
        async function pullModel() {
            const modelName = document.getElementById('modelName').value.trim();
            if (!modelName) return alert('Enter model name');
            
            showStatus(`Pulling ${modelName}...`, 'loading');
            
            try {
                const response = await fetch(`${API_URL}/models/pull?model_name=${modelName}`, {
                    method: 'POST'
                });
                
                const data = await response.json();
                document.getElementById('pullOutput').innerHTML = `<div class="status success">Model pulled successfully</div>`;
                showStatus('Model ready', 'success');
            } catch (e) {
                document.getElementById('pullOutput').innerHTML = `<div class="status error">${e.message}</div>`;
                showStatus('Error', 'error');
            }
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        checkHealth();
        setInterval(checkHealth, 30000);
    </script>
</body>
</html>
